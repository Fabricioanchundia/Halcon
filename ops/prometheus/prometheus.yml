# Prometheus de Halcón. Descubre a TODOS los scorers por DNS: "docker compose --scale scorer=3"
# crea tres contenedores con el mismo nombre de servicio, y Prometheus los encuentra solo.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: halcon-scorer
    dns_sd_configs:
      - names: ["scorer"]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
